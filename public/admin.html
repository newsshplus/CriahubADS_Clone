<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CriaHub - Painel Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f1a;--card:#1a1a2e;--card2:#16213e;--accent:#e94560;--accent2:#0f3460;--text:#eee;--text2:#aaa;--success:#00c853;--warning:#ffd600;--border:#2a2a4a;--input:#12122a}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent);text-decoration:none}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0f0f1a 0%,#1a1a2e 50%,#16213e 100%)}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:420px;max-width:90vw;text-align:center}
.login-box h1{font-size:28px;margin-bottom:8px;background:linear-gradient(90deg,var(--accent),#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-box p{color:var(--text2);margin-bottom:32px;font-size:14px}
.login-box input{width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:var(--input);color:var(--text);font-size:15px;margin-bottom:16px;outline:none;transition:border .2s}
.login-box input:focus{border-color:var(--accent)}
.login-box button{width:100%;padding:14px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .2s}
.login-box button:hover{opacity:.85}
.login-error{color:var(--accent);font-size:13px;margin-top:8px;display:none}

/* LAYOUT */
.app{display:none;min-height:100vh}
.sidebar{position:fixed;top:0;left:0;width:240px;height:100vh;background:var(--card);border-right:1px solid var(--border);padding:24px 0;z-index:10}
.sidebar .logo{padding:0 24px 24px;font-size:22px;font-weight:700;background:linear-gradient(90deg,var(--accent),#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sidebar nav a{display:flex;align-items:center;gap:12px;padding:12px 24px;color:var(--text2);font-size:14px;transition:all .2s;border-left:3px solid transparent}
.sidebar nav a:hover,.sidebar nav a.active{color:var(--text);background:rgba(233,69,96,.08);border-left-color:var(--accent)}
.sidebar nav a .icon{font-size:18px;width:24px;text-align:center}
.sidebar .logout{position:absolute;bottom:24px;left:24px;right:24px;padding:10px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text2);cursor:pointer;font-size:13px;text-align:center;transition:all .2s}
.sidebar .logout:hover{border-color:var(--accent);color:var(--accent)}

.main{margin-left:240px;padding:32px 40px}
.main h2{font-size:24px;margin-bottom:24px}
.main h3{font-size:18px;margin-bottom:16px;color:var(--text2)}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center}
.stat-card .number{font-size:32px;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:13px;color:var(--text2);margin-top:4px}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:12px 16px;font-size:12px;text-transform:uppercase;color:var(--text2);letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:12px 16px;font-size:14px;border-bottom:1px solid rgba(42,42,74,.5)}
tr:hover td{background:rgba(233,69,96,.03)}

/* BADGES */
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-active{background:rgba(0,200,83,.15);color:var(--success)}
.badge-paused{background:rgba(255,214,0,.15);color:var(--warning)}
.badge-connected{background:rgba(0,200,83,.15);color:var(--success)}
.badge-disconnected{background:rgba(233,69,96,.15);color:var(--accent)}
.badge-stage{background:rgba(15,52,96,.5);color:#64b5f6}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:var(--accent2);color:#fff}
.btn-secondary:hover{opacity:.85}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-danger{background:rgba(233,69,96,.15);color:var(--accent);border:1px solid rgba(233,69,96,.3)}
.btn-danger:hover{background:rgba(233,69,96,.25)}

/* FORM */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--input);color:var(--text);font-size:14px;outline:none;transition:border .2s;font-family:inherit}
.form-group input:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:80px}
.form-group small{display:block;margin-top:4px;font-size:12px;color:var(--text2)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;width:520px;max-width:90vw;max-height:80vh;overflow-y:auto}
.modal h3{margin-bottom:20px}
.modal-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}

/* TOAST */
.toast{position:fixed;top:20px;right:20px;padding:14px 20px;border-radius:10px;font-size:14px;z-index:200;animation:slideIn .3s;max-width:400px}
.toast-success{background:rgba(0,200,83,.9);color:#fff}
.toast-error{background:rgba(233,69,96,.9);color:#fff}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* EMPTY STATE */
.empty{text-align:center;padding:48px 24px;color:var(--text2)}
.empty .icon{font-size:48px;margin-bottom:12px}
.empty p{margin-bottom:16px}

/* LOADING */
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{width:60px}
  .sidebar .logo{font-size:16px;padding:0 12px 16px;text-align:center}
  .sidebar nav a span{display:none}
  .sidebar nav a{justify-content:center;padding:12px}
  .sidebar .logout span{display:none}
  .sidebar .logout{padding:10px;text-align:center}
  .main{margin-left:60px;padding:20px}
  .form-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <h1>CriaHub</h1>
    <p>Automação Instagram - Painel Admin</p>
    <input type="password" id="loginPassword" placeholder="Digite sua senha..." onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Entrar</button>
    <div class="login-error" id="loginError">Senha incorreta</div>
  </div>
</div>

<!-- APP -->
<div class="app" id="appWrap">
  <div class="sidebar">
    <div class="logo">CriaHub</div>
    <nav>
      <a href="#" data-page="dashboard" class="active"><span class="icon">&#9632;</span> <span>Dashboard</span></a>
      <a href="#" data-page="accounts"><span class="icon">&#9775;</span> <span>Contas</span></a>
      <a href="#" data-page="campaigns"><span class="icon">&#9889;</span> <span>Campanhas</span></a>
      <a href="#" data-page="contacts"><span class="icon">&#9900;</span> <span>Contatos</span></a>
      <a href="#" data-page="settings"><span class="icon">&#9881;</span> <span>Configurações</span></a>
    </nav>
    <button class="logout" onclick="doLogout()"><span>&#10550;</span> <span>Sair</span></button>
  </div>

  <div class="main" id="mainContent"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<!-- TOAST -->
<div id="toast" class="toast" style="display:none"></div>

<script>
const API = '';
let TOKEN = localStorage.getItem('criahub_token') || '';

// --- AUTH ---
async function doLogin(){
  const pw = document.getElementById('loginPassword').value;
  try{
    const r = await fetch(API+'/admin/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    const d = await r.json();
    if(d.ok){TOKEN=d.token;localStorage.setItem('criahub_token',TOKEN);showApp()}
    else{document.getElementById('loginError').style.display='block'}
  }catch(e){document.getElementById('loginError').style.display='block'}
}
function doLogout(){TOKEN='';localStorage.removeItem('criahub_token');location.reload()}
function authHeaders(){return{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'}}
async function api(method,path,body){
  const opts={method,headers:authHeaders()};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(API+path,opts);
  if(r.status===401){doLogout();return null}
  return await r.json();
}

// --- NAV ---
let currentPage='dashboard';
document.querySelectorAll('.sidebar nav a').forEach(a=>{
  a.onclick=e=>{
    e.preventDefault();
    document.querySelector('.sidebar nav a.active')?.classList.remove('active');
    a.classList.add('active');
    currentPage=a.dataset.page;
    loadPage(currentPage);
  }
});

// --- PAGES ---
async function loadPage(page){
  const m=document.getElementById('mainContent');
  m.innerHTML='<div style="text-align:center;padding:48px"><div class="spinner" style="width:32px;height:32px"></div></div>';
  if(page==='dashboard')await renderDashboard(m);
  else if(page==='accounts')await renderAccounts(m);
  else if(page==='campaigns')await renderCampaigns(m);
  else if(page==='contacts')await renderContacts(m);
  else if(page==='settings')renderSettings(m);
}

// --- DASHBOARD ---
async function renderDashboard(m){
  const accounts=await api('GET','/admin/api/accounts');
  const campaigns=await api('GET','/admin/api/campaigns');
  const contacts=await api('GET','/admin/api/contacts');
  const convStates=await api('GET','/admin/api/conversations');

  const accCount=(accounts||[]).length;
  const campCount=(campaigns||[]).length;
  const conCount=(contacts||[]).length;
  const delivered=(convStates||[]).filter(c=>c.stage==='entregue').length;
  const pending=(convStates||[]).filter(c=>c.stage!=='entregue').length;

  m.innerHTML=`
    <h2>Dashboard</h2>
    <div class="stat-grid">
      <div class="stat-card"><div class="number">${accCount}</div><div class="label">Contas Conectadas</div></div>
      <div class="stat-card"><div class="number">${campCount}</div><div class="label">Campanhas Ativas</div></div>
      <div class="stat-card"><div class="number">${conCount}</div><div class="label">Total de Contatos</div></div>
      <div class="stat-card"><div class="number" style="color:var(--success)">${delivered}</div><div class="label">Conteúdo Entregue</div></div>
      <div class="stat-card"><div class="number" style="color:var(--warning)">${pending}</div><div class="label">Em Andamento</div></div>
    </div>
    <div class="card">
      <h3>Últimos Contatos</h3>
      ${(!contacts||!contacts.length)?'<div class="empty"><div class="icon">&#9900;</div><p>Nenhum contato ainda</p></div>':
      `<div class="table-wrap"><table>
        <tr><th>Username</th><th>Primeiro contato</th><th>Último contato</th></tr>
        ${(contacts||[]).slice(0,10).map(c=>`<tr><td>@${c.username||c.igsid}</td><td>${fmt(c.first_seen_at)}</td><td>${fmt(c.last_seen_at)}</td></tr>`).join('')}
      </table></div>`}
    </div>`;
}

// --- ACCOUNTS ---
async function renderAccounts(m){
  const accounts=await api('GET','/admin/api/accounts');
  m.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
      <h2 style="margin:0">Contas Instagram</h2>
      <button class="btn btn-primary" onclick="connectAccount()">+ Conectar Conta</button>
    </div>
    ${(!accounts||!accounts.length)?
    `<div class="card"><div class="empty"><div class="icon">&#9775;</div><p>Nenhuma conta conectada</p><button class="btn btn-primary" onclick="connectAccount()">Conectar agora</button></div></div>`:
    `<div class="card"><div class="table-wrap"><table>
      <tr><th>Username</th><th>IG User ID</th><th>Status</th><th>Token expira em</th></tr>
      ${(accounts||[]).map(a=>`<tr>
        <td><strong>@${a.username||'?'}</strong></td>
        <td><code>${a.ig_user_id}</code></td>
        <td><span class="badge badge-${a.status==='connected'?'active':'paused'}">${a.status}</span></td>
        <td>${a.token_expires_at?fmt(a.token_expires_at):'-'}</td>
      </tr>`).join('')}
    </table></div></div>`}`;
}

// --- CAMPAIGNS ---
async function renderCampaigns(m){
  const campaigns=await api('GET','/admin/api/campaigns');
  m.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
      <h2 style="margin:0">Campanhas</h2>
      <button class="btn btn-primary" onclick="showNewCampaign()">+ Nova Campanha</button>
    </div>
    ${(!campaigns||!campaigns.length)?
    `<div class="card"><div class="empty"><div class="icon">&#9889;</div><p>Nenhuma campanha criada</p><button class="btn btn-primary" onclick="showNewCampaign()">Criar primeira campanha</button></div></div>`:
    `<div class="card"><div class="table-wrap"><table>
      <tr><th>Palavra-chave</th><th>Mensagem</th><th>Conteúdo</th><th>Status</th><th>Ações</th></tr>
      ${(campaigns||[]).map(c=>`<tr>
        <td><strong>${esc(c.keyword)}</strong></td>
        <td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.private_reply_message)}</td>
        <td><a href="${esc(c.delivery_content)}" target="_blank">${esc(c.delivery_content).substring(0,30)}...</a></td>
        <td><span class="badge badge-${c.status==='active'?'active':'paused'}">${c.status}</span></td>
        <td><button class="btn btn-outline btn-sm" onclick="editCampaign('${c.id}')">Editar</button></td>
      </tr>`).join('')}
    </table></div></div>`}`;
}

// --- CONTACTS ---
async function renderContacts(m){
  const contacts=await api('GET','/admin/api/contacts');
  const convStates=await api('GET','/admin/api/conversations');
  const convMap={};
  (convStates||[]).forEach(c=>{convMap[c.contact_id]=c});

  m.innerHTML=`
    <h2>Contatos</h2>
    ${(!contacts||!contacts.length)?
    `<div class="card"><div class="empty"><div class="icon">&#9900;</div><p>Nenhum contato registrado ainda</p></div></div>`:
    `<div class="card"><div class="table-wrap"><table>
      <tr><th>Username</th><th>IGSID</th><th>Estado</th><th>Primeiro contato</th></tr>
      ${(contacts||[]).map(c=>{
        const cs=convMap[c.id];
        const stage=cs?cs.stage:'-';
        const stageLabel=stage==='entregue'?'Entregue':stage==='aguardando_follow'?'Aguardando Follow':stage==='aguardando_quero'?'Aguardando "QUERO"':stage;
        return `<tr>
          <td><strong>@${c.username||'?'}</strong></td>
          <td><code style="font-size:12px">${c.igsid}</code></td>
          <td><span class="badge badge-stage">${stageLabel}</span></td>
          <td>${fmt(c.first_seen_at)}</td>
        </tr>`;
      }).join('')}
    </table></div></div>`}`;
}

// --- SETTINGS ---
function renderSettings(m){
  m.innerHTML=`
    <h2>Configurações</h2>
    <div class="card">
      <h3>Webhook</h3>
      <div class="form-group">
        <label>URL do Webhook (configure no Meta Developer)</label>
        <input type="text" value="${location.origin}" readonly style="opacity:.7">
      </div>
      <div class="form-group">
        <label>Verify Token</label>
        <input type="text" value="criahub_webhook_123" readonly style="opacity:.7">
      </div>
    </div>
    <div class="card">
      <h3>Suporte</h3>
      <p style="color:var(--text2);font-size:14px">Dúvidas? Acesse a documentação ou entre em contato.</p>
    </div>`;
}

// --- MODALS ---
function showModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modalOverlay').classList.add('show')}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}

function connectAccount(){
  showModal(`
    <h3>Conectar Conta Instagram</h3>
    <p style="color:var(--text2);margin-bottom:16px;font-size:14px">Clique abaixo para autorizar uma conta profissional do Instagram.</p>
    <div class="form-group">
      <label>Nome do Cliente</label>
      <input type="text" id="clientName" placeholder="Ex: João Silva">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="clientEmail" placeholder="email@exemplo.com">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="createAndConnect()">Criar e Conectar</button>
    </div>`);
}

async function createAndConnect(){
  const name=document.getElementById('clientName').value;
  const email=document.getElementById('clientEmail').value;
  if(!name||!email){toast('Preencha nome e email','error');return}
  const r=await api('POST','/admin/api/clients',{name,email});
  if(r&&r.connect_url){window.open(r.connect_url,'_blank');closeModal();toast('Conta conectada! Atualizando...','success');setTimeout(()=>loadPage('accounts'),2000)}
  else{toast('Erro ao criar cliente','error')}
}

function showNewCampaign(){
  showModal(`
    <h3>Nova Campanha</h3>
    <div class="form-group">
      <label>Palavra-chave do comentário</label>
      <input type="text" id="campKeyword" placeholder="Ex: ACESSO" style="text-transform:uppercase">
      <small>A pessoa deve comentar essa palavra no post</small>
    </div>
    <div class="form-group">
      <label>Mensagem automática (DM)</label>
      <textarea id="campReply" placeholder="Recebemos seu comentário! Responda QUERO aqui."></textarea>
      <small>Enviada como resposta privada ao comentário</small>
    </div>
    <div class="form-group">
      <label>Mensagem de pedido de follow</label>
      <textarea id="campFollow" placeholder="Você precisa seguir nosso perfil para receber o conteúdo."></textarea>
    </div>
    <div class="form-group">
      <label>Link/Conteúdo a entregar</label>
      <input type="text" id="campContent" placeholder="https://www.criahub.global">
      <small>Link que será enviado quando a pessoa seguir</small>
    </div>
    <div class="form-group">
      <label>Conta Instagram</label>
      <select id="campAccount"></select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="createCampaign()">Criar Campanha</button>
    </div>`);
  loadAccountSelect();
}

async function loadAccountSelect(){
  const accounts=await api('GET','/admin/api/accounts');
  const sel=document.getElementById('campAccount');
  if(!sel)return;
  sel.innerHTML=(accounts||[]).map(a=>`<option value="${a.ig_user_id}">@${a.username||a.ig_user_id}</option>`).join('');
  if(!accounts||!accounts.length){sel.innerHTML='<option>Nenhuma conta conectada</option>'}
}

async function createCampaign(){
  const kw=document.getElementById('campKeyword').value.trim();
  const reply=document.getElementById('campReply').value.trim();
  const follow=document.getElementById('campFollow').value.trim();
  const content=document.getElementById('campContent').value.trim();
  const acc=document.getElementById('campAccount').value;
  if(!kw){toast('Palavra-chave obrigatória','error');return}
  const r=await api('POST','/admin/api/campaigns',{ig_user_id:acc,keyword:kw,private_reply_message:reply||undefined,follow_request_message:follow||undefined,delivery_content:content||undefined});
  if(r&&r.campaign_id){closeModal();toast('Campanha criada!','success');loadPage('campaigns')}
  else{toast(r?.error||'Erro ao criar','error')}
}

async function editCampaign(id){
  const campaigns=await api('GET','/admin/api/campaigns');
  const c=(campaigns||[]).find(x=>x.id===id);
  if(!c)return;
  showModal(`
    <h3>Editar Campanha</h3>
    <div class="form-group">
      <label>Palavra-chave</label>
      <input type="text" id="editKeyword" value="${esc(c.keyword)}" style="text-transform:uppercase">
    </div>
    <div class="form-group">
      <label>Mensagem automática</label>
      <textarea id="editReply">${esc(c.private_reply_message)}</textarea>
    </div>
    <div class="form-group">
      <label>Pedido de follow</label>
      <textarea id="editFollow">${esc(c.follow_request_message)}</textarea>
    </div>
    <div class="form-group">
      <label>Conteúdo/Link</label>
      <input type="text" id="editContent" value="${esc(c.delivery_content)}">
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger btn-sm" onclick="deleteCampaign('${id}')">Excluir</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveCampaign('${id}')">Salvar</button>
    </div>`);
}

async function saveCampaign(id){
  const kw=document.getElementById('editKeyword').value.trim();
  const reply=document.getElementById('editReply').value.trim();
  const follow=document.getElementById('editFollow').value.trim();
  const content=document.getElementById('editContent').value.trim();
  const r=await api('PUT','/admin/api/campaigns/'+id,{keyword:kw,private_reply_message:reply,follow_request_message:follow,delivery_content:content});
  if(r&&r.ok){closeModal();toast('Campanha atualizada!','success');loadPage('campaigns')}
  else{toast(r?.error||'Erro ao salvar','error')}
}

async function deleteCampaign(id){
  if(!confirm('Tem certeza que deseja excluir esta campanha?'))return;
  const r=await api('DELETE','/admin/api/campaigns/'+id);
  if(r&&r.ok){closeModal();toast('Campanha excluída','success');loadPage('campaigns')}
}

// --- UTILS ---
function fmt(s){if(!s)return'-';try{return new Date(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return s}}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast toast-'+type;t.style.display='block';
  setTimeout(()=>{t.style.display='none'},4000);
}

// --- INIT ---
if(TOKEN)showApp();
else document.getElementById('loginWrap').style.display='flex';

function showApp(){document.getElementById('loginWrap').style.display='none';document.getElementById('appWrap').style.display='block';loadPage('dashboard')}
</script>
